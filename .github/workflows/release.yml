name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run a release for a tag that already exists, e.g. after fixing this workflow; tags are protected
  # and never moved. Builds from the dispatched ref, so the tag's version must match it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          case "$tag" in
            v*) version="${tag#v}" ;;
            *) echo "::error::unexpected tag $tag"; exit 1 ;;
          esac
          export LC_ALL=C
          id='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$"
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::$tag: '$version' is not a valid semver version"
            exit 1
          fi
          cargo=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          package=$(python3 -c "import json; print(json.load(open('packaging/release.json'))['version'])")
          for pair in "Cargo.toml=$cargo" "packaging/release.json=$package"; do
            if [ "${pair#*=}" != "$version" ]; then
              echo "::error file=${pair%%=*}::$tag does not match version '${pair#*=}' in ${pair%%=*}"
              exit 1
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: [check, ci]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-ui
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tag="$TAG"
          title="r3cui $VERSION"
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
          latest=true
          if [ "$prerelease" = true ]; then latest=false; fi
          if out=$(gh release view "$tag" --json isDraft --jq .isDraft 2>&1); then
            # Releases are immutable once published: a re-run only finishes a draft.
            if [ "$out" = true ]; then
              gh release upload "$tag" release/* --clobber
              gh release edit "$tag" --title "$title" --prerelease="$prerelease" --latest="$latest" --draft=false
            else
              echo "::notice::$tag is already published; keeping its assets"
            fi
          elif [[ "$out" != *"release not found"* ]]; then
            echo "::error::gh release view $tag failed: $out"
            exit 1
          else
            args=(--verify-tag --title "$title" --generate-notes --prerelease="$prerelease" --latest="$latest")
            prev=$(git tag --list "v*" --sort=-v:refname | grep -vxF "$tag" | head -1 || true)
            if [ -n "$prev" ]; then args+=(--notes-start-tag "$prev"); fi
            gh release create "$tag" release/* "${args[@]}"
          fi
