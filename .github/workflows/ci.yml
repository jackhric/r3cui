name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  UC_SDK_URL: https://github.com/unfoldedcircle/ucr2-toolchain/releases/download/v1.0.1/ucr2-aarch64-toolchain-1.0.1-noqt.tar.gz
  UC_SDK_SHA256: 9307f0006d7dbc49e2ab6a2040f4633cd48318f6a5598cdc3b54af2cf417b7ef

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --workspace --locked

  device:
    name: Device package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the Unfolded Circle SDK
        run: |
          curl -fsSL "$UC_SDK_URL" -o "$RUNNER_TEMP/sdk.tar.gz"
          echo "$UC_SDK_SHA256  $RUNNER_TEMP/sdk.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sdk"
          tar -xzf "$RUNNER_TEMP/sdk.tar.gz" -C "$RUNNER_TEMP/sdk"
          echo "UC_SDK=$RUNNER_TEMP/sdk/aarch64-buildroot-linux-gnu_sdk-buildroot" >> "$GITHUB_ENV"
      # Only r3cui's own crates rebuild when the lockfile is unchanged; a lockfile change starts from
      # the newest older cache, so most dependencies still come from it. The script pins the Rust
      # image, so a toolchain bump changes its hash and starts a fresh cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target-device
            ${{ runner.temp }}/cargo-registry
          key: device-${{ hashFiles('scripts/build-device.sh') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: device-${{ hashFiles('scripts/build-device.sh') }}-
      - run: scripts/build-device.sh
        env:
          CARGO_REGISTRY: ${{ runner.temp }}/cargo-registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-ui
          path: packaging/out/remote-ui.tar.gz
          if-no-files-found: error

  site:
    name: Site
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
