<title>@TITLE@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: a dark viewing room. One quiet control bar, then black 480x800 panels at true pixel size or scaled to fit. */
  :root {
    color-scheme: dark;
    --room: #0b0b0d;
    --bezel: #1d1d21;
    --line: #26262b;
    --ink: #ededf0;
    --dim: #8d8d97;
    --pick: #ffffff;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--room);
    color: var(--ink);
    font: 14px/1.45 var(--ui);
  }
  .page {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 2100px;
    margin-inline: auto;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .bar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 auto 0 0;
    letter-spacing: 0.01em;
  }
  .seg {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .seg button {
    font: 500 13px/1 var(--ui);
    color: var(--dim);
    background: none;
    border: 0;
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--pick); color: #000; }
  .seg button:focus-visible, .nav:focus-visible, .frame:focus-visible {
    outline: 2px solid var(--pick);
    outline-offset: 2px;
  }
  .about {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
    min-height: 22px;
  }
  .about strong { font-size: 18px; font-weight: 600; }
  .about .fonts { color: var(--dim); font-size: 13px; }
  .about .note { color: var(--dim); flex-basis: 100%; max-width: 70ch; }
  .keys { color: var(--dim); font-size: 12px; }
  .keys kbd {
    font: 500 11px/1 var(--ui);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 5px;
    color: var(--ink);
  }

  .viewer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .nav {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: none;
    color: var(--ink);
    font: 400 20px/1 var(--ui);
    cursor: pointer;
  }
  .nav:hover { background: #16161a; }
  body:not([data-mode="one"]) .nav { display: none; }

  .stage {
    --z: 1;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px 20px;
    touch-action: pan-y;
  }
  .variant { display: contents; }
  .frame { margin: 0; display: none; flex-direction: column; gap: 8px; cursor: pointer; }
  body[data-mode="one"] .frame { cursor: default; }
  body[data-mode="one"] .frame[data-on-variant][data-on-screen],
  body[data-mode="variant"] .frame[data-on-variant],
  body[data-mode="compare"] .frame[data-on-screen] { display: flex; }
  .bezel {
    border: 1px solid var(--bezel);
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    line-height: 0;
  }
  .frame figcaption { color: var(--dim); font-size: 12px; text-align: center; }
  body[data-mode="one"] .frame figcaption { display: none; }

  /* The panel itself. Variants design inside this box in device pixels. */
  .screen {
    width: 480px;
    height: 800px;
    position: relative;
    overflow: hidden;
    background: #000;
    box-sizing: border-box;
    line-height: normal;
    zoom: var(--z);
  }
  .screen *, .screen *::before, .screen *::after { box-sizing: border-box; }
</style>

<div class="page">
  <div class="bar">
    <h1>@TITLE@</h1>
    <div class="seg" id="variant-tabs" role="group" aria-label="Variant"></div>
    <div class="seg" id="screen-tabs" role="group" aria-label="Screen"></div>
    <div class="seg" id="mode-tabs" role="group" aria-label="View">
      <button type="button" data-mode="one">Single</button>
      <button type="button" data-mode="variant">All screens</button>
      <button type="button" data-mode="compare">Compare variants</button>
    </div>
  </div>
  <div class="about">
    <strong id="about-name"></strong>
    <span class="fonts" id="about-fonts"></span>
    <span class="keys"><kbd>←</kbd> <kbd>→</kbd> screen · <kbd>↑</kbd> <kbd>↓</kbd> variant · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> view</span>
    <span class="note" id="about-note"></span>
  </div>
  <div class="viewer">
    <button type="button" class="nav" id="nav-prev" aria-label="Previous screen">‹</button>
    <div class="stage" id="stage">
