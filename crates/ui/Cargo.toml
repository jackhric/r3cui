[package]
name = "remote-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "remote-ui"
path = "src/main.rs"

[dependencies]
coreapi = { path = "../coreapi" }
tokio.workspace = true
kodi = { path = "../kodi" }
drivers = { path = "../drivers" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "2", default-features = false }

# `desktop` (default) runs in a window on the workstation. `device` renders straight to the
# remote's display through KMS; libinput is left out because the device has none, and
# input/evdev.rs reads the touchscreen and keys itself.
[dependencies.slint]
version = "1.19"
default-features = false
features = ["compat-1-18", "std"]

[dependencies.evdev]
version = "0.12"
optional = true

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-femtovg", "preview", "drivers/demo"]
device = ["slint/backend-linuxkms", "slint/renderer-femtovg", "slint/renderer-software", "slint/software-renderer-path", "dep:evdev"]
# Screenshot, recording and remote-photo framing tools (--shots, --snap, --record, --frame).
preview = []

[dev-dependencies]
drivers = { path = "../drivers", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
slint-build = "1.19"
