[package]
name = "kodi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "r3cui's own Kodi client: typed JSON-RPC over WebSocket and HTTP, and Kodi's state for the UI."

[dependencies]
tokio.workspace = true
wsclient = { path = "../wsclient" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tracing.workspace = true
thiserror = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "signal"] }
tracing-subscriber.workspace = true

[features]
# FakeKodi: an in-process Kodi JSON-RPC WebSocket server for tests.
testing = ["wsclient/testing"]

[[test]]
name = "fake"
required-features = ["testing"]

[[example]]
name = "fake-kodi"
required-features = ["testing"]
