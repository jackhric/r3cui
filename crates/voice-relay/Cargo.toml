[package]
name = "voice-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "r3cui's voice relay: a custom integration that takes the core's microphone audio and hands it to r3cui over the voice link."

[lib]
name = "voice_relay"

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
prost.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
voicelink = { path = "../voicelink" }

[dev-dependencies]
voicelink = { path = "../voicelink", features = ["testing"] }
