[package]
name = "host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "r3cui's side of its drivers: modules.json, the host that runs the integrations the app lists, the input list."

[dependencies]
r3cui-sdk = { path = "../sdk" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[features]
# FakeDriver, for testing routing with no program behind it.
testing = ["r3cui-sdk/testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
r3cui-sdk = { path = "../sdk", features = ["testing"] }
