[package]
name = "androidtv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "r3cui's own Android TV client: the Android TV Remote protocol v2 (pairing and remote) over TLS."

[dependencies]
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rsa = { version = "0.9", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
x509-parser = { version = "0.18", default-features = false }
sha2 = "0.10"
prost = "0.14"
serde.workspace = true
tracing.workspace = true
thiserror = "2"
wsclient = { path = "../wsclient" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "signal"] }
tracing-subscriber.workspace = true
serde_json.workspace = true

[features]
# FakeTv: an in-process Android TV (pairing and remote channels) for tests and the desktop app.
testing = []

[[test]]
name = "fake"
required-features = ["testing"]

[[example]]
name = "fake-androidtv"
required-features = ["testing"]
