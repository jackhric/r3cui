[package]
name = "voicelink"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The localhost voice link between r3cui and its voice relay integration: the frames, and r3cui's reconnecting client."

[dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
