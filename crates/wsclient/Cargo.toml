[package]
name = "wsclient"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The WebSocket plumbing r3cui's driver crates share: a pinged connection, reconnect with backoff, pending calls."

[dependencies]
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["__rustls-tls"] }
rustls.workspace = true
webpki-roots = "0.26"
futures-util.workspace = true
tracing.workspace = true
thiserror = "2"

[features]
# A reusable in-process WebSocket server for faking a device in tests, and test helpers.
testing = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
