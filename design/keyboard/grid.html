<style>
  .kb-grid{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;color:#F1F3F3;font-size:18px;line-height:24px;--t2:#8B9195;--t3:#53595D;--hair:rgba(255,255,255,.08);--red:#E8343A}
  .kb-grid *{box-sizing:border-box;margin:0}
  .kb-grid .hd{position:absolute;left:0;right:0;top:20px;height:72px;display:flex;align-items:center;padding:0 24px;gap:16px}
  .kb-grid .hd svg{width:28px;height:28px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;color:#F1F3F3;transition:color .1s}
  .kb-grid .hd svg.flash{color:var(--red)}
  .kb-grid .hd span{font-size:26px;line-height:32px;font-weight:500}
  .kb-grid .fld{position:absolute;left:12px;right:12px;top:108px;height:80px;border-radius:20px;background:#0E0E0F;display:flex;align-items:center;justify-content:center;padding:0 20px;font-size:36px;line-height:44px;font-weight:300;white-space:nowrap;overflow:hidden}
  .kb-grid .fld .cnt{position:absolute;right:20px;top:6px;font-size:13px;line-height:16px;letter-spacing:.12em;color:var(--t3)}
  .kb-grid .car{display:inline-block;width:3px;height:40px;border-radius:2px;background:var(--red);margin-left:3px;animation:grid-blink 1.1s steps(1) infinite}
  @keyframes grid-blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.kb-grid .car{animation:none}}
  .kb-grid .tabs{position:absolute;left:12px;width:456px;top:212px;height:48px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .kb-grid .grd{position:absolute;left:12px;width:456px;top:276px;display:grid;grid-template-columns:repeat(7,60px);grid-auto-rows:68px;gap:6px}
  .kb-grid .act{position:absolute;left:12px;width:456px;top:586px;height:72px;display:grid;grid-template-columns:repeat(7,60px);gap:6px}
  .kb-grid .k{position:relative;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#111112;color:#B9BDBF;font-size:30px;line-height:36px;font-weight:300;cursor:pointer;user-select:none}
  .kb-grid .tab{font-size:20px;font-weight:400;letter-spacing:.06em;color:var(--t2);background:#0E0E0F;border-radius:24px}
  .kb-grid .tab.sel{background:#1A1A1B;color:#F1F3F3;font-weight:500}
  .kb-grid .wide{font-size:22px;font-weight:400;letter-spacing:.02em;color:var(--t2);background:#161617}
  .kb-grid .join.ready{background:rgba(232,52,58,.16);color:var(--red);font-weight:500}
  .kb-grid .join.dim{color:var(--t3);background:#0E0E0F}
  .kb-grid .k.on{color:#fff;font-weight:500}
  .kb-grid .k.on::after{content:"";position:absolute;inset:0;border:4px solid var(--red);border-radius:16px;pointer-events:none}
  .kb-grid .hint{position:absolute;left:0;right:0;top:700px;text-align:center;font-size:18px;line-height:24px;color:var(--t3)}
  .kb-grid .busy{position:absolute;left:0;right:0;top:108px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#000}
  .kb-grid .busy[hidden]{display:none}
  .kb-grid .ring{width:72px;height:72px;border-radius:50%;border:6px solid rgba(255,255,255,.14);border-top-color:var(--red);animation:grid-spin 1s linear infinite}
  @keyframes grid-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.kb-grid .ring{animation:none}}
  .kb-grid .busy b{font-size:32px;line-height:40px;font-weight:300}
  .kb-grid .busy i{font-style:normal;font-size:22px;color:var(--t2)}
</style>
<article class="screen kb-grid" data-name="Grid" data-note="An alphabetical 7-column grid of large keys with focusable mode tabs above and one action row below, where focus is a thick red cursor travelling over a calm grid.">
  <div class="hd"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Guest</span></div>
  <div class="fld"></div>
  <div class="tabs"></div>
  <div class="grd"></div>
  <div class="act"></div>
  <div class="hint">OK types · BACK deletes</div>
  <div class="busy" hidden><div class="ring"></div><b>Joining…</b><i>Guest</i></div>
</article>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const $ = s => root.querySelector(s);
  const fld = $('.fld'), tabsEl = $('.tabs'), grd = $('.grd'), actEl = $('.act'), busy = $('.busy'), chev = $('.hd svg');
  const letters = 'abcdefghijklmnopqrstuvwxyz'.split('').concat(['.', '-']);
  const sets = [
    letters,
    letters.map(c => c.toUpperCase()),
    '1234567890'.split('').concat('. , - _ @ # $ % & * + = / ? ! : ;'.split(' ')),
    '! @ # $ % & * - _ . ? / : ; = + ( ) [ ] { } < > ~ ^ | \\'.split(' '),
  ];
  const tabNames = ['abc', 'ABC', '123', '#+='];
  const tabCol = [0, 2, 4, 6];
  const tabOf = c => Math.floor(c * 4 / 7);
  const actDefs = [
    { name: 'Space', from: 0, to: 2 },
    { name: 'Delete', from: 3, to: 4 },
    { name: 'Join', from: 5, to: 6 },
  ];
  const actOf = c => actDefs.findIndex(a => c >= a.from && c <= a.to);
  const MAXLEN = 32;

  let text = 'Bl4de', mode = 0, zone = 'grid', r = 0, c = 0, col = 0, ai = 0, ti = 0, joining = false;

  const tabEls = tabNames.map((n, i) => {
    const e = document.createElement('div');
    e.className = 'k tab'; e.textContent = n;
    e.addEventListener('click', () => { zone = 'tab'; ti = i; col = tabCol[i]; setMode(i); render(); });
    tabsEl.appendChild(e); return e;
  });
  const cells = [];
  for (let i = 0; i < 28; i++) {
    const e = document.createElement('div');
    e.className = 'k';
    e.addEventListener('click', () => { zone = 'grid'; r = Math.floor(i / 7); c = col = i % 7; type(sets[mode][i]); render(); });
    grd.appendChild(e); cells.push(e);
  }
  const actEls = actDefs.map((a, i) => {
    const e = document.createElement('div');
    e.className = 'k wide' + (a.name === 'Join' ? ' join' : '');
    e.style.gridColumn = (a.from + 1) + ' / ' + (a.to + 2);
    e.textContent = a.name;
    e.addEventListener('click', () => { zone = 'act'; ai = i; if (col < a.from || col > a.to) col = a.from + ((a.to - a.from) >> 1); activate(i); render(); });
    actEl.appendChild(e); return e;
  });

  function type(ch) { if (text.length < MAXLEN) text += ch; }
  function setMode(i) { mode = i; }
  function del() { text = text.slice(0, -1); }
  function activate(i) {
    const n = actDefs[i].name;
    if (n === 'Space') type(' ');
    else if (n === 'Delete') del();
    else if (text.length >= 8) {
      joining = true;
      setTimeout(() => { joining = false; render(); }, 1500);
    }
  }

  function render() {
    const shown = text.length > 16 ? '…' + text.slice(-15) : text;
    fld.textContent = shown;
    const caret = document.createElement('span'); caret.className = 'car'; fld.appendChild(caret);
    const cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = text.length + ' / ' + MAXLEN; fld.appendChild(cnt);
    tabEls.forEach((e, i) => {
      e.classList.toggle('sel', i === mode);
      e.classList.toggle('on', !joining && zone === 'tab' && ti === i);
    });
    cells.forEach((e, i) => {
      e.textContent = sets[mode][i];
      e.classList.toggle('on', !joining && zone === 'grid' && r * 7 + c === i);
    });
    actEls.forEach((e, i) => e.classList.toggle('on', !joining && zone === 'act' && ai === i));
    const ready = text.length >= 8;
    actEls[2].classList.toggle('ready', ready);
    actEls[2].classList.toggle('dim', !ready);
    busy.hidden = !joining;
  }

  function move(dir) {
    if (zone === 'grid') {
      if (dir === 'left') c = (c + 6) % 7;
      else if (dir === 'right') c = (c + 1) % 7;
      else if (dir === 'up') { if (r === 0) { zone = 'tab'; ti = tabOf(c); } else r--; }
      else if (dir === 'down') { if (r === 3) { zone = 'act'; ai = actOf(c); } else r++; }
      if (zone === 'grid') col = c;
    } else if (zone === 'tab') {
      if (dir === 'left') { ti = (ti + 3) % 4; col = tabCol[ti]; }
      else if (dir === 'right') { ti = (ti + 1) % 4; col = tabCol[ti]; }
      else if (dir === 'down') { zone = 'grid'; r = 0; c = col; }
      else if (dir === 'up') { zone = 'act'; ai = actOf(col); }
    } else {
      if (dir === 'left' || dir === 'right') {
        ai = (ai + (dir === 'left' ? 2 : 1)) % 3;
        const a = actDefs[ai];
        if (col < a.from || col > a.to) col = a.from + ((a.to - a.from) >> 1);
      } else if (dir === 'up') { zone = 'grid'; r = 3; c = col; }
      else if (dir === 'down') { zone = 'tab'; ti = tabOf(col); }
    }
  }

  function flashBack() {
    chev.classList.add('flash');
    setTimeout(() => chev.classList.remove('flash'), 300);
  }

  render();
  (window.KB = window.KB || {})['grid'] = {
    key(name) {
      if (joining) return;
      if (name === 'back') { if (text) del(); else flashBack(); }
      else if (name === 'ok') {
        if (zone === 'grid') type(sets[mode][r * 7 + c]);
        else if (zone === 'tab') setMode(ti);
        else activate(ai);
      } else move(name);
      render();
    },
  };
})();
</script>
