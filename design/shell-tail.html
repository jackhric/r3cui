    </div>
    <button type="button" class="nav" id="nav-next" aria-label="Next screen">›</button>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const variants = [...stage.querySelectorAll('.variant')];
  if (!variants.length) return;
  const screens = [...variants[0].querySelectorAll('.screen')].map(s => s.dataset.label || s.dataset.screen);
  const frames = [];

  variants.forEach((v, vi) => {
    [...v.querySelectorAll('.screen')].forEach((s, si) => {
      const frame = document.createElement('figure');
      frame.className = 'frame';
      frame.tabIndex = 0;
      const bezel = document.createElement('div');
      bezel.className = 'bezel';
      const cap = document.createElement('figcaption');
      cap.textContent = v.dataset.name + ' · ' + (s.dataset.label || s.dataset.screen);
      s.replaceWith(frame);
      bezel.append(s);
      frame.append(bezel, cap);
      const open = () => { if (state.mode !== 'one') set({ v: vi, s: si, mode: 'one' }); };
      frame.addEventListener('click', open);
      frame.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
      frames.push({ frame, vi, si });
    });
  });

  const state = { v: 0, s: 0, mode: 'one' };
  try {
    const saved = JSON.parse(localStorage.getItem('@KEY@') || '{}');
    if (saved.v < variants.length) state.v = saved.v | 0;
    if (saved.s < screens.length) state.s = saved.s | 0;
    if (['one', 'variant', 'compare'].includes(saved.mode)) state.mode = saved.mode;
  } catch (e) {}

  const tabs = (host, labels, key) => labels.map((label, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', () => set({ [key]: i }));
    host.append(b);
    return b;
  });
  const vTabs = tabs(document.getElementById('variant-tabs'), variants.map(v => v.dataset.name), 'v');
  const sTabs = tabs(document.getElementById('screen-tabs'), screens, 's');
  const mTabs = [...document.querySelectorAll('#mode-tabs button')];
  mTabs.forEach(b => b.addEventListener('click', () => set({ mode: b.dataset.mode })));

  function fit() {
    const w = stage.clientWidth;
    let z;
    if (state.mode === 'one') {
      const room = window.innerHeight - stage.getBoundingClientRect().top - window.scrollY - 32;
      z = Math.min(1, w / 482, Math.max(0.6, room / 802));
    } else {
      const want = state.mode === 'variant' ? 3 : variants.length;
      const cols = w >= 1000 ? want : w >= 620 ? 2 : 1;
      z = Math.min(1, (w - 20 * (cols - 1)) / (cols * 482));
    }
    stage.style.setProperty('--z', z.toFixed(3));
  }

  function render() {
    document.body.dataset.mode = state.mode;
    frames.forEach(({ frame, vi, si }) => {
      frame.toggleAttribute('data-on-variant', vi === state.v);
      frame.toggleAttribute('data-on-screen', si === state.s);
    });
    vTabs.forEach((b, i) => b.setAttribute('aria-pressed', i === state.v && state.mode !== 'compare'));
    sTabs.forEach((b, i) => b.setAttribute('aria-pressed', i === state.s && state.mode !== 'variant'));
    mTabs.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
    const v = variants[state.v];
    const comparing = state.mode === 'compare';
    document.getElementById('about-name').textContent = comparing ? screens[state.s] : v.dataset.name;
    document.getElementById('about-fonts').textContent = comparing ? 'all variants' : v.dataset.fonts || '';
    document.getElementById('about-note').textContent = comparing ? '' : v.dataset.note || '';
    fit();
  }

  function set(patch) {
    Object.assign(state, patch);
    state.v = (state.v + variants.length) % variants.length;
    state.s = (state.s + screens.length) % screens.length;
    try { localStorage.setItem('@KEY@', JSON.stringify(state)); } catch (e) {}
    render();
  }

  document.getElementById('nav-prev').addEventListener('click', () => set({ s: state.s - 1 }));
  document.getElementById('nav-next').addEventListener('click', () => set({ s: state.s + 1 }));
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight') set({ s: state.s + 1 });
    else if (k === 'ArrowLeft') set({ s: state.s - 1 });
    else if (k === 'ArrowDown') set({ v: state.v + 1 });
    else if (k === 'ArrowUp') set({ v: state.v - 1 });
    else if (k === '1') set({ mode: 'one' });
    else if (k === '2') set({ mode: 'variant' });
    else if (k === '3') set({ mode: 'compare' });
    else return;
    e.preventDefault();
  });

  let swipe = null;
  stage.addEventListener('pointerdown', e => { swipe = { x: e.clientX, y: e.clientY }; });
  stage.addEventListener('pointerup', e => {
    if (!swipe || state.mode !== 'one') return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 2 * Math.abs(dy)) set({ s: state.s + (dx < 0 ? 1 : -1) });
  });

  window.addEventListener('resize', fit);
  render();
})();
</script>
